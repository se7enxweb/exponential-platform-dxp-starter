name: Browser tests

# Installs this skeleton (the tagged or chosen version) as an Exponential
# Platform DXP project on SQLite and checks the front page and the admin
# login in Chromium. Runs for every pushed tag and on demand.

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            project-version:
                description: 'Released version to test (empty: the branch the run starts from)'
                required: false
                type: string
                default: ''

permissions:
    contents: read

jobs:
    browser-tests:
        name: Browser tests
        uses: se7enxweb/gh-workflows/.github/workflows/browser-tests.yml@main
        with:
            project-version: ${{ github.ref_type == 'tag' && github.ref_name || inputs.project-version }}
        secrets: inherit
